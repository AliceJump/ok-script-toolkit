<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src __CSP_SOURCE__ 'nonce-__CSP_NONCE__'">
  <title></title>
  <link rel="stylesheet" href="__STYLE_URI__">
</head>
<body>
  <main class="app-shell">
    <header class="app-toolbar">
      <div id="executorState" class="executor-state" aria-live="polite"></div>
      <div class="app-toolbar__actions">
        <button id="startExecutor" type="button" hidden></button>
        <button id="pauseToggle" class="secondary" type="button" hidden></button>
        <button id="stopCurrent" class="secondary" type="button" hidden></button>
        <button id="stopExecutor" class="secondary danger" type="button" hidden></button>
        <button id="refresh" class="secondary icon-button" type="button"></button>
      </div>
    </header>
    <section id="tasks" class="task-list" aria-live="polite"></section>
    <section id="status" class="status-banner" hidden aria-live="polite"></section>
    <section id="empty" class="empty-state" hidden></section>
  </main>

  <script nonce="__CSP_NONCE__">globalThis.__TASK_LAUNCHER_I18N__ = __I18N_JSON__;</script>
  <script src="__CORE_SCRIPT_URI__"></script>
  <script src="__FIELDS_SCRIPT_URI__"></script>
  <script src="__CONFIG_PANEL_SCRIPT_URI__"></script>
  <script src="__TASK_CARD_SCRIPT_URI__"></script>
  <script src="__APP_SCRIPT_URI__"></script>
</body>
</html>
