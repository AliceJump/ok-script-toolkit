<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src __CSP_SOURCE__ 'nonce-__CSP_NONCE__'; img-src data: __CSP_SOURCE__">
<link rel="stylesheet" href="__SHARED_TOKENS_URI__">
<link rel="stylesheet" href="__SHARED_CONTROLS_URI__">
<link rel="stylesheet" href="__STYLE_URI__">
<link rel="stylesheet" href="__CONFLICT_STYLE_URI__">
</head>
<body>
  <div class="panel-toolbar toolbar">
    <div class="annotation-mode-switch" id="annotationModeGroup" role="group" aria-label="Annotation mode">
      <button class="mini-btn" id="templateModeBtn" type="button">Template</button>
      <button class="mini-btn" id="rectModeBtn" type="button">Box</button>
      <button class="mini-btn" id="pointModeBtn" type="button">Point</button>
    </div>
    <label class="shared-history-toggle" id="sharedHistoryWrap" title="Share undo/redo history between template, box and point modes">
      <input id="sharedHistoryChk" type="checkbox" checked />
      <span id="sharedHistoryLabel">Shared undo history</span>
    </label>
    <label class="shared-history-toggle" id="coordPreferenceWrap" title="Unchecked: x1,y1,x2,y2. Checked: x,y,w,h. This also resolves ambiguous unnamed four-number pastes.">
      <input id="coordPreferXywhChk" type="checkbox" />
      <span id="coordPreferLabel">XYWH</span>
    </label>
    <span class="toolbar-separator" aria-hidden="true"></span>
    <button class="mini-btn" id="drawBtn">Draw (R)</button>
    <button class="mini-btn" id="coordBtn">Coords (C)</button>
    <button class="mini-btn" id="deleteBtn">Delete (D)</button>
    <button class="icon-btn" id="undoBtn" title="Undo">↩</button>
    <button class="icon-btn" id="redoBtn" title="Redo">↪</button>
    <div class="spacer"></div>
    <span class="info" id="navInfo"></span>
    <button class="icon-btn" id="prevBtn" title="Previous image">◀</button>
    <button class="icon-btn" id="nextBtn" title="Next image">▶</button>
  </div>
  <div class="editor-body">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="empty" id="emptyMsg"></div>
    </div>
    <aside class="annotation-list">
      <div class="annotation-list-title" id="annotationListTitle"></div>
      <section class="conflict-panel" id="conflictPanel" hidden>
        <div class="conflict-summary" id="conflictSummary"></div>
        <div class="conflict-rows" id="conflictRows"></div>
        <button class="mini-btn mini-btn--primary conflict-apply" id="conflictApply" type="button"></button>
      </section>
      <div class="annotation-list-actions">
        <button class="mini-btn" id="showAllBtn" type="button"></button>
        <button class="mini-btn" id="hideAllBtn" type="button"></button>
        <button class="mini-btn" id="onlyCurrentBtn" type="button"></button>
      </div>
      <div class="annotation-list-rows" id="annotationRows"></div>
    </aside>
  </div>
  <div class="color-bar">
    <div class="color-swatch" id="swatch"></div>
    <span id="colorInfo"></span>
  </div>

  <div class="modal-overlay" id="bboxModal">
    <div class="modal">
      <h3 id="bboxTitle">Bounding Box</h3>
      <div class="row">
        <label id="bboxCatLabel">Category:</label>
        <input type="text" id="bboxCat" placeholder="Category name" />
      </div>
      <div class="error" id="bboxError"></div>
      <div class="row" id="bboxXRow"><label>X:</label><input type="number" id="bboxX" min="0" /></div>
      <div class="row" id="bboxYRow"><label>Y:</label><input type="number" id="bboxY" min="0" /></div>
      <div class="row" id="bboxWRow"><label id="bboxWLabel">Width:</label><input type="number" id="bboxW" min="1" /></div>
      <div class="row" id="bboxHRow"><label id="bboxHLabel">Height:</label><input type="number" id="bboxH" min="1" /></div>
      <div class="actions">
        <button class="mini-btn" id="bboxCancel">Cancel</button>
        <button class="mini-btn mini-btn--primary" id="bboxOk">OK</button>
      </div>
    </div>
  </div>
  <div id="annotationPanelI18n" hidden>__I18N_JSON__</div>
  <script nonce="__CSP_NONCE__">
    (() => {
      const nativeAcquire = window.acquireVsCodeApi;
      let sharedApi;
      window.acquireVsCodeApi = () => sharedApi || (sharedApi = nativeAcquire());
    })();
  </script>
  <script src="__EXTERNAL_SYNC_SCRIPT_URI__"></script>
  <script src="__CONFLICT_SCRIPT_URI__"></script>
  <script src="__APP_SCRIPT_URI__"></script>
</body>
</html>
