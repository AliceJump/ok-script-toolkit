<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<body>
  <div class="panel-toolbar toolbar">
    <div class="annotation-mode-switch" role="group" aria-label="Annotation mode">
      <button class="mini-btn" id="templateModeBtn" type="button">Template</button>
      <button class="mini-btn" id="rectModeBtn" type="button">Box</button>
      <button class="mini-btn" id="pointModeBtn" type="button">Point</button>
    </div>
    <label class="shared-history-toggle" title="Share undo/redo history between template, box and point modes">
      <input id="sharedHistoryChk" type="checkbox" checked />
      <span id="sharedHistoryLabel">Shared undo history</span>
    </label>
    <label class="shared-history-toggle" title="Unchecked: x1,y1,x2,y2. Checked: x,y,w,h. This also resolves ambiguous unnamed four-number pastes.">
      <input id="coordPreferXywhChk" type="checkbox" />
      <span>XYWH</span>
    </label>
    <span class="toolbar-separator" aria-hidden="true"></span>
    <button class="mini-btn" id="drawBtn">Draw (R)</button>
    <button class="mini-btn" id="coordBtn">Coords (C)</button>
    <button class="mini-btn" id="deleteBtn">Delete (D)</button>
    <button class="mini-btn" id="generateBoxBtn" type="button"></button>
    <button class="icon-btn" id="undoBtn" title="Undo">↩</button>
    <button class="icon-btn" id="redoBtn" title="Redo">↪</button>
    <div class="spacer"></div>
    <span class="info" id="navInfo"></span>
    <button class="icon-btn" id="prevBtn" title="Previous image">◀</button>
    <button class="icon-btn" id="nextBtn" title="Next image">▶</button>
  </div>
  <div class="editor-body">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="empty" id="emptyMsg"></div>
    </div>
    <aside class="annotation-list">
      <div class="annotation-list-title" id="annotationListTitle"></div>
      <div class="annotation-list-actions">
        <button class="mini-btn" id="showAllBtn" type="button"></button>
        <button class="mini-btn" id="hideAllBtn" type="button"></button>
        <button class="mini-btn" id="onlyCurrentBtn" type="button"></button>
      </div>
      <div class="annotation-list-rows" id="annotationRows"></div>
    </aside>
  </div>
  <div class="color-bar">
    <div class="color-swatch" id="swatch"></div>
    <span id="colorInfo"></span>
  </div>

  <div class="modal-overlay" id="bboxModal">
    <div class="modal">
      <h3 id="bboxTitle">Bounding Box</h3>
      <div class="row">
        <label id="bboxCatLabel">Category:</label>
        <input type="text" id="bboxCat" placeholder="Category name" />
      </div>
      <div class="error" id="bboxError"></div>
      <div class="row" id="bboxXRow"><label>X:</label><input type="number" id="bboxX" min="0" /></div>
      <div class="row" id="bboxYRow"><label>Y:</label><input type="number" id="bboxY" min="0" /></div>
      <div class="row" id="bboxWRow"><label id="bboxWLabel">Width:</label><input type="number" id="bboxW" min="1" /></div>
      <div class="row" id="bboxHRow"><label id="bboxHLabel">Height:</label><input type="number" id="bboxH" min="1" /></div>
      <div class="actions">
        <button class="mini-btn" id="bboxCancel">Cancel</button>
        <button class="mini-btn mini-btn--primary" id="bboxOk">OK</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="generateModal">
    <div class="modal">
      <h3 id="generateTitle">Create box</h3>
      <div id="generateChoices"></div>
      <div class="row">
        <label id="generatePathLabel" for="generatePath">Path:</label>
        <input type="text" id="generatePath" />
      </div>
      <div class="error" id="generateError"></div>
      <div class="actions">
        <button class="mini-btn" id="generateCancel" type="button">Cancel</button>
        <button class="mini-btn mini-btn--primary" id="generateOk" type="button">OK</button>
      </div>
    </div>
  </div>
  <div id="annotationPanelI18n" hidden>__I18N_JSON__</div>
  <script nonce="__CSP_NONCE__">
    // Coordinate normalization bridge:
    // - named {name,bbox} is always the plugin's explicit XYWH protocol;
    // - bare four-number values may be XYWH or XYXY;
    // - if only one interpretation is geometrically valid, use it automatically;
    // - if both are valid, use the user's XYWH checkbox preference (default: XYXY);
    // - point mode projects an area box to its center before the editor handles naming/history/save.
    (() => {
      const nativeAcquire = window.acquireVsCodeApi;
      const nativeApi = nativeAcquire();
      const coordPreferenceKey = 'coordPreferXywh';
      const decimals = 4;
      const eps = 1e-6;
      const clamp01 = value => Math.max(0, Math.min(1, value));
      const round = value => Number(value.toFixed(6));
      const state = () => (typeof nativeApi.getState === 'function' && nativeApi.getState()) || {};
      let preferXywh = state()[coordPreferenceKey] === true;
      let pointPasteMode = false;
      let lastCoordXywh = null;
      let lastCoordPrefix = '';
      let renderedCoordText = null;

      const checkbox = document.getElementById('coordPreferXywhChk');
      checkbox.checked = preferXywh;

      function pairedZero(w, h) {
        return (Math.abs(w) <= eps) === (Math.abs(h) <= eps);
      }

      function asXywh(values) {
        if (!Array.isArray(values) || values.length !== 4) return null;
        const [x0, y0, w0, h0] = values.map(Number);
        if (![x0, y0, w0, h0].every(Number.isFinite)) return null;
        if (x0 < -eps || y0 < -eps || w0 < -eps || h0 < -eps || x0 > 1 + eps || y0 > 1 + eps
          || x0 + w0 > 1 + eps || y0 + h0 > 1 + eps || !pairedZero(w0, h0)) return null;
        const x = clamp01(x0), y = clamp01(y0);
        const w = Math.abs(w0) <= eps ? 0 : Math.min(clamp01(w0), 1 - x);
        const h = Math.abs(h0) <= eps ? 0 : Math.min(clamp01(h0), 1 - y);
        return { x, y, w, h };
      }

      function asXyxy(values) {
        if (!Array.isArray(values) || values.length !== 4) return null;
        const [x10, y10, x20, y20] = values.map(Number);
        if (![x10, y10, x20, y20].every(Number.isFinite)) return null;
        if (x10 < -eps || y10 < -eps || x20 < -eps || y20 < -eps
          || x10 > 1 + eps || y10 > 1 + eps || x20 > 1 + eps || y20 > 1 + eps
          || x20 + eps < x10 || y20 + eps < y10) return null;
        const x1 = clamp01(x10), y1 = clamp01(y10), x2 = clamp01(x20), y2 = clamp01(y20);
        const w = Math.max(0, x2 - x1), h = Math.max(0, y2 - y1);
        if (!pairedZero(w, h)) return null;
        return { x: x1, y: y1, w: Math.abs(w) <= eps ? 0 : w, h: Math.abs(h) <= eps ? 0 : h };
      }

      function chooseBare(values) {
        const xywh = asXywh(values);
        const xyxy = asXyxy(values);
        if (xywh && !xyxy) return xywh;
        if (xyxy && !xywh) return xyxy;
        if (xywh && xyxy) return preferXywh ? xywh : xyxy;
        return null;
      }

      function pointify(box) {
        if (!pointPasteMode || (box.w === 0 && box.h === 0)) return box;
        return { x: round(box.x + box.w / 2), y: round(box.y + box.h / 2), w: 0, h: 0 };
      }

      function bboxArray(box) {
        return [round(box.x), round(box.y), round(box.w), round(box.h)];
      }

      function parseBareNumbers(text) {
        const raw = String(text || '').trim();
        if (!raw || raw.startsWith('{')) return null;
        let parsed;
        try { parsed = JSON.parse(raw); } catch { parsed = undefined; }
        if (Array.isArray(parsed) && parsed.length === 4 && parsed.every(value => Number.isFinite(Number(value)))) {
          return parsed.map(Number);
        }
        if (parsed !== undefined) return null;
        const values = raw.replace(/[\[\]()]/g, ' ').split(/[\s,;]+/).filter(Boolean).map(Number);
        return values.length === 4 && values.every(Number.isFinite) ? values : null;
      }

      function formatXywh(box, spaced) {
        const sep = spaced ? ', ' : ',';
        return [box.x, box.y, box.w, box.h].map(value => value.toFixed(decimals)).join(sep);
      }

      function formatPreferred(box, spaced) {
        if (preferXywh) return formatXywh(box, spaced);
        const sep = spaced ? ', ' : ',';
        return [box.x, box.y, box.x + box.w, box.y + box.h].map(value => value.toFixed(decimals)).join(sep);
      }

      function normalizeClipboardText(text) {
        const raw = String(text || '').trim();
        if (!raw) return raw;
        let parsed;
        try { parsed = JSON.parse(raw); } catch { parsed = undefined; }

        // An object with bbox is explicit COCO/plugin XYWH, never ambiguous.
        if (parsed && !Array.isArray(parsed) && typeof parsed === 'object' && Array.isArray(parsed.bbox)) {
          const box = asXywh(parsed.bbox);
          if (!box) return raw;
          return JSON.stringify({ ...parsed, bbox: bboxArray(pointify(box)) });
        }

        let values;
        if (Array.isArray(parsed)) values = parsed;
        else if (parsed === undefined) values = parseBareNumbers(raw);
        if (!values) return raw;
        const box = chooseBare(values);
        if (!box) return raw;
        // Emit an explicit XYWH array so the main editor never has to guess a second time.
        return JSON.stringify(bboxArray(pointify(box)));
      }

      function copyMessage(message) {
        if (!message || message.type !== 'copyText' || typeof message.text !== 'string') return message;
        const values = parseBareNumbers(message.text);
        if (!values) return message;
        // All unnamed four-number copies produced by the editor are internally XYWH.
        const box = asXywh(values);
        if (!box) return message;
        const spaced = message.text.includes(', ');
        if (document.getElementById('coordBtn')?.classList.contains('active')) lastCoordXywh = box;
        return { ...message, text: formatPreferred(box, spaced) };
      }

      const api = {
        postMessage(message) { return nativeApi.postMessage(copyMessage(message)); },
        getState() { return typeof nativeApi.getState === 'function' ? nativeApi.getState() : undefined; },
        setState(next) { return typeof nativeApi.setState === 'function' ? nativeApi.setState(next) : undefined; },
      };
      window.acquireVsCodeApi = () => api;

      function renderCoordReadout() {
        const info = document.getElementById('colorInfo');
        if (!info || !lastCoordXywh || !document.getElementById('coordBtn')?.classList.contains('active')) return;
        const next = lastCoordPrefix + formatPreferred(lastCoordXywh, true);
        renderedCoordText = next;
        if (info.textContent !== next) info.textContent = next;
      }

      const info = document.getElementById('colorInfo');
      const coordNumberTail = /^(.*?)(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*$/;
      if (info && typeof MutationObserver !== 'undefined') {
        new MutationObserver(() => {
          if (!document.getElementById('coordBtn')?.classList.contains('active')) return;
          if (info.textContent === renderedCoordText) return;
          const match = String(info.textContent || '').match(coordNumberTail);
          if (!match) return;
          const box = asXywh(match.slice(2).map(Number));
          if (!box) return;
          lastCoordPrefix = match[1];
          lastCoordXywh = box;
          renderCoordReadout();
        }).observe(info, { childList: true, characterData: true, subtree: true });
      }

      checkbox.addEventListener('change', () => {
        preferXywh = checkbox.checked;
        if (typeof nativeApi.setState === 'function') nativeApi.setState({ ...state(), [coordPreferenceKey]: preferXywh });
        renderCoordReadout();
      });

      window.addEventListener('message', event => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;
        if ((msg.type === 'config' || msg.type === 'load') && msg.annotationMode) {
          pointPasteMode = msg.annotationMode === 'point';
          return;
        }
        if (msg.type === 'clipboardText' && typeof msg.text === 'string') {
          msg.text = normalizeClipboardText(msg.text);
        }
      }, true);
    })();
  </script>
  <script src="__APP_SCRIPT_URI__"></script>
  <script nonce="__CSP_NONCE__">
    document.getElementById('coordBtn')?.addEventListener('click', () => {
      const button = document.getElementById('coordBtn');
      if (!button?.classList.contains('active')) {
        const info = document.getElementById('colorInfo');
        if (info) info.textContent = '';
      }
    });
  </script>
</body>
</html>
