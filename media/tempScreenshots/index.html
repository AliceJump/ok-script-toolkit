<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src __CSP_SOURCE__ 'nonce-__CSP_NONCE__'; img-src data: __CSP_SOURCE__">
<link rel="stylesheet" href="__SHARED_TOKENS_URI__">
<link rel="stylesheet" href="__SHARED_CONTROLS_URI__">
<link rel="stylesheet" href="__STYLE_URI__">
</head>
<body>
  <div class="panel-toolbar toolbar">
    <button class="mini-btn" id="pasteBtn">Paste</button>
    <button class="mini-btn" id="captureBtn">Capture</button>
    <label class="fg-check" id="fgCheck" title="Hard foreground"><input id="hardForegroundChk" type="checkbox"><span id="hardForegroundLabel">Hard foreground</span></label>
    <button class="mini-btn" id="clearBtn">Clear</button>
    <div class="spacer"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="stage" id="stage">
    <div class="stage-inner" id="stageInner"></div>
    <div class="stage-overlay" id="stageOverlay">
      <div class="sel-box" id="selBox">
        <span class="sel-handle" data-h="tl"></span>
        <span class="sel-handle" data-h="t"></span>
        <span class="sel-handle" data-h="tr"></span>
        <span class="sel-handle" data-h="r"></span>
        <span class="sel-handle" data-h="br"></span>
        <span class="sel-handle" data-h="b"></span>
        <span class="sel-handle" data-h="bl"></span>
        <span class="sel-handle" data-h="l"></span>
        <span class="sel-coord" id="selCoord"></span>
      </div>
    </div>
    <div class="stage-empty" id="stageEmpty"></div>
  </div>

  <div class="stage-bar">
    <button class="mini-btn" id="carouselBtn">0.1s</button>
    <button class="mini-btn" id="coordBtn">Box</button>
    <div class="spacer"></div>
    <span class="coord" id="coordInfo"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyHint" style="display:none"></div>

  <div class="toast" id="toast"></div>

  <div class="confirm" id="confirmBar">
    <span id="confirmText"></span>
    <div class="confirm-actions">
      <button class="mini-btn" id="confirmCancel">Cancel</button>
      <button class="mini-btn mini-btn--danger" id="confirmOk">OK</button>
    </div>
  </div>

  <div id="tempPanelI18n" hidden>__I18N_JSON__</div>
  <script src="__APP_SCRIPT_URI__"></script>
</body>
</html>
