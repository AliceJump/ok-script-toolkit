<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src __CSP_SOURCE__ 'nonce-__CSP_NONCE__'">
  <title></title>
  <link rel="stylesheet" href="__SHARED_TOKENS_URI__">
  <link rel="stylesheet" href="__SHARED_CONTROLS_URI__">
  <link rel="stylesheet" href="__STYLE_URI__">
</head>
<body>
  <main class="console">
    <div class="shell">

    <!-- ── 主从双栏 · 侧栏导航（任务/游戏/配置/账号） ─────────────── -->
    <aside class="lay-side" id="sideNav" role="tablist">
      <div class="lay-side__item is-active" id="segTasks" data-seg="tasks" role="tab" tabindex="0" aria-selected="true">
        <span class="lay-side__ico" aria-hidden="true"></span><span class="lay-side__label"></span>
      </div>
      <div class="lay-side__item" id="segGame" data-seg="game" role="tab" tabindex="0" aria-selected="false">
        <span class="lay-side__ico" aria-hidden="true"></span><span class="lay-side__label"></span>
      </div>
      <div class="lay-side__item" id="segConfig" data-seg="config" role="tab" tabindex="0" aria-selected="false">
        <span class="lay-side__ico" aria-hidden="true"></span><span class="lay-side__label"></span>
      </div>
      <div class="lay-side__item" id="segAccounts" data-seg="accounts" role="tab" tabindex="0" aria-selected="false">
        <span class="lay-side__ico" aria-hidden="true"></span><span class="lay-side__label"></span>
      </div>
      <div class="lay-side__foot" id="sideFoot"></div>
    </aside>

    <div class="lay-main">

    <!-- ── 全局状态条：游戏连接 + 常驻执行器 ─────────────────────── -->
    <header class="gbar">
      <div class="gbar__row" id="gameRow" role="button" tabindex="0" title="">
        <svg class="gbar__ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="10.5" rx="5"/><path d="M7 10.5v3.5M5.2 12.2h3.6M15.4 11h.01M17.8 13.4h.01"/></svg>
        <span class="gbar__dot" id="gameDot"></span>
        <span class="gbar__val" id="gameState"></span>
        <span class="gbar__actions">
          <button id="connectGame" class="mini-btn mini-btn--primary" type="button" hidden></button>
          <button id="disconnectGame" class="mini-btn" type="button" hidden></button>
        </span>
      </div>
      <div class="gbar__row">
        <svg class="gbar__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.8l11.5 7.2-11.5 7.2z"/></svg>
        <span class="gbar__dot" id="execDot"></span>
        <span class="gbar__val"><span id="executorState"></span></span>
        <span class="gbar__actions">
          <button id="startExecutor" class="mini-btn mini-btn--primary" type="button" hidden></button>
          <button id="pauseToggle" class="mini-btn" type="button" hidden></button>
          <button id="stopCurrent" class="mini-btn" type="button" hidden></button>
          <button id="stopExecutor" class="mini-btn mini-btn--danger" type="button" hidden></button>
        </span>
      </div>
      <div class="gbar__sub" id="executorSub" hidden aria-live="polite"></div>
    </header>

    <!-- ── 状态横幅（加载错误 / 连接提示等） ──────────────────────── -->
    <section id="status" class="status-banner" hidden aria-live="polite"></section>

    <!-- ── 分段：任务（含配置健康度条 + 执行队列条） ──────────────── -->
    <section class="page" id="pageTasks" role="tabpanel">
      <section id="healthStrip" class="rc-health" hidden></section>
      <div class="search-row">
        <div class="search">
          <svg class="search__ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="taskSearch" type="text" autocomplete="off" spellcheck="false">
        </div>
        <button id="refresh" class="icon-btn" type="button"></button>
      </div>

      <section id="queueStrip" class="rc-queue" hidden></section>

      <div id="tasks" class="task-list" aria-live="polite">
        <div class="group-head" id="triggerHead" role="button" tabindex="0">
          <svg class="group-head__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <span id="triggerHeadLabel"></span>
          <span class="group-head__count" id="triggerCount"></span>
        </div>
        <div class="group-body" id="gTriggers"></div>

        <div class="group-head" id="onetimeHead" role="button" tabindex="0">
          <svg class="group-head__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <span id="onetimeHeadLabel"></span>
          <span class="group-head__count" id="onetimeCount"></span>
        </div>
        <div class="group-body" id="gOnetime"></div>
      </div>

      <section id="empty" class="empty-state" hidden></section>

      <div class="hint-strip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>
        <span id="consoleHint"></span>
      </div>
    </section>

    <!-- ── 分段：配置（全局配置组 · 快照接管）─────────────────────── -->
    <section class="page" id="pageConfig" role="tabpanel" hidden>
      <div class="takeover-banner" id="takeoverBanner"></div>
      <div id="configList" class="gconfig-list" aria-live="polite"></div>
    </section>

    <!-- ── 分段：账号（多账户存储只读概要）───────────────────────── -->
    <section class="page" id="pageAccounts" role="tabpanel" hidden>
      <div id="accountList" class="gconfig-list" aria-live="polite"></div>
    </section>

    <!-- ── 分段：游戏 ────────────────────────────────────────────── -->
    <section class="page" id="pageGame" role="tabpanel" hidden>
      <div class="connect-card">
        <div class="connect-card__icon" id="gameIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="10.5" rx="5"/><path d="M7 10.5v3.5M5.2 12.2h3.6M15.4 11h.01M17.8 13.4h.01"/></svg>
        </div>
        <div class="connect-card__title" id="gameCardTitle"></div>
        <div class="connect-card__sub" id="gameCardSub"></div>
        <button id="gameCardConnect" class="primary-btn" type="button" hidden></button>
        <button id="gameCardDisconnect" class="secondary-btn" type="button" hidden></button>
      </div>

      <div class="tool-row">
        <div class="tool-row__body">
          <div class="tool-row__title" id="overlayLabel"></div>
          <div class="tool-row__hint" id="overlayHint"></div>
        </div>
        <label class="switch">
          <input type="checkbox" id="overlayToggle">
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </div>

      <button id="openCharacterManager" class="secondary-btn tool-entry" type="button"></button>
    </section>

    </div><!-- /lay-main -->
    </div><!-- /shell -->
  </main>

  <!-- ── 参数抽屉（点击任务卡片的「参数」把表单搬运到这里） ───────── -->
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-hidden="true">
    <header class="drawer__head">
      <div>
        <div class="drawer__title" id="drawerTitle"></div>
        <div class="drawer__sub" id="drawerAutoSave"></div>
      </div>
      <button id="drawerClose" class="icon-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>

  <script nonce="__CSP_NONCE__">globalThis.__TASK_LAUNCHER_I18N__ = __I18N_JSON__;</script>
  <script src="__CORE_SCRIPT_URI__"></script>
  <script src="__FIELDS_SCRIPT_URI__"></script>
  <script src="__CONFIG_PANEL_SCRIPT_URI__"></script>
  <script src="__TASK_CARD_SCRIPT_URI__"></script>
  <script src="__CONSOLE_SCRIPT_URI__"></script>
  <script src="__APP_SCRIPT_URI__"></script>
</body>
</html>
