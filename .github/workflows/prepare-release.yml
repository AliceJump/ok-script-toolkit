name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump after the current synchronized version is already tagged
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional explicit MAJOR.MINOR.PATCH (can equal current version to tag a prepared release)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare, push, tag, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@v4

      - name: Validate release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Configure RELEASE_TOKEN as a maintainer PAT with Contents read/write and Actions read access to both repositories."
            exit 1
          fi

      - name: Synchronize release commits and push tag
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PARENT_REPO: ${{ github.repository }}
          CHILD_REPO: ${{ github.repository_owner }}/ok-script-toolkit-jetbrains
          BUMP_LEVEL: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          RELEASE_GIT_NAME: ${{ github.actor }}
          RELEASE_GIT_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: bash scripts/release/orchestrate-release.sh

      - name: Start downstream Release workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail

          # A tag pushed with GITHUB_TOKEN does not start another workflow. The
          # production path therefore dispatches Release explicitly. Keep the
          # tag-push trigger in release.yml as an independent/manual entry point.
          # During migration, an external token may still have caused the tag
          # push to start Release already; avoid launching a duplicate run.
          existing=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --event push \
            --limit 20 \
            --json databaseId,headSha,url \
            --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | [.databaseId, .url] | @tsv" \
            | head -n 1 || true)

          if [ -n "$existing" ]; then
            IFS=$'\t' read -r run_id run_url <<< "$existing"
            echo "Release already started from the tag push: $run_url"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$RELEASE_TAG"

          run_id=""
          run_url=""
          for _ in $(seq 1 30); do
            row=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle,url \
              --jq ".[] | select(.displayTitle == \"Release $RELEASE_TAG\") | [.databaseId, .url] | @tsv" \
              | head -n 1 || true)
            if [ -n "$row" ]; then
              IFS=$'\t' read -r run_id run_url <<< "$row"
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "::error::release.yml was dispatched for $RELEASE_TAG but its run could not be found."
            exit 1
          fi

          echo "Release dispatched: $run_url"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for downstream Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            echo "::error::Downstream Release run id is missing."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
          PARENT_SHA: ${{ steps.prepare.outputs.parent_sha }}
          CHILD_SHA: ${{ steps.prepare.outputs.child_sha }}
        run: |
          {
            echo "## One-click release"
            echo
            if [ -n "$TAG" ]; then
              echo "- Version: \`$VERSION\`"
              echo "- Tag: \`$TAG\`"
            fi
            if [ -n "$CHILD_SHA" ]; then
              echo "- JetBrains main: \`$CHILD_SHA\`"
            fi
            if [ -n "$PARENT_SHA" ]; then
              echo "- Parent main: \`$PARENT_SHA\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
