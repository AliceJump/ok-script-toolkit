name: codex-review-fixes

on:
  push:
    branches:
      - codex/unified-annotation-resources

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-annotation-resources
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------------
          # 1) app.js: native coordinate protocol + mode-switch barrier + no-op saves
          # ------------------------------------------------------------------
          p = Path('media/annotationPanel/app.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "  let copyCoordsSpace = true;\n",
              "  let copyCoordsSpace = true;\n"
              "  let modeLoading = false;\n"
              "  let pendingMode = null;\n"
              "  let coordPreferXywh = savedUi.coordPreferXywh === true;\n"
              "  const COORD_EPS = 1e-6;\n\n"
              "  function pairedZero(w, h) { return (Math.abs(w) <= COORD_EPS) === (Math.abs(h) <= COORD_EPS); }\n"
              "  function asXywh(values) {\n"
              "    if (!Array.isArray(values) || values.length !== 4) return null;\n"
              "    const [x0,y0,w0,h0] = values.map(Number);\n"
              "    if (![x0,y0,w0,h0].every(Number.isFinite) || x0 < -COORD_EPS || y0 < -COORD_EPS || w0 < -COORD_EPS || h0 < -COORD_EPS\n"
              "      || x0 > 1 + COORD_EPS || y0 > 1 + COORD_EPS || x0 + w0 > 1 + COORD_EPS || y0 + h0 > 1 + COORD_EPS\n"
              "      || !pairedZero(w0,h0)) return null;\n"
              "    const x=clamp01(x0), y=clamp01(y0);\n"
              "    const w=Math.abs(w0)<=COORD_EPS?0:Math.min(clamp01(w0),1-x);\n"
              "    const h=Math.abs(h0)<=COORD_EPS?0:Math.min(clamp01(h0),1-y);\n"
              "    return {x,y,w,h};\n"
              "  }\n"
              "  function asXyxy(values) {\n"
              "    if (!Array.isArray(values) || values.length !== 4) return null;\n"
              "    const [x10,y10,x20,y20] = values.map(Number);\n"
              "    if (![x10,y10,x20,y20].every(Number.isFinite) || x10 < -COORD_EPS || y10 < -COORD_EPS || x20 < -COORD_EPS || y20 < -COORD_EPS\n"
              "      || x10 > 1 + COORD_EPS || y10 > 1 + COORD_EPS || x20 > 1 + COORD_EPS || y20 > 1 + COORD_EPS\n"
              "      || x20 + COORD_EPS < x10 || y20 + COORD_EPS < y10) return null;\n"
              "    const x1=clamp01(x10), y1=clamp01(y10), x2=clamp01(x20), y2=clamp01(y20);\n"
              "    const w=Math.max(0,x2-x1), h=Math.max(0,y2-y1);\n"
              "    if (!pairedZero(w,h)) return null;\n"
              "    return {x:x1,y:y1,w:Math.abs(w)<=COORD_EPS?0:w,h:Math.abs(h)<=COORD_EPS?0:h};\n"
              "  }\n"
              "  function interpretBareCoordinates(values) {\n"
              "    const xywh=asXywh(values), xyxy=asXyxy(values);\n"
              "    if (xywh && !xyxy) return xywh;\n"
              "    if (xyxy && !xywh) return xyxy;\n"
              "    if (xywh && xyxy) return coordPreferXywh ? xywh : xyxy;\n"
              "    return null;\n"
              "  }\n"
          )

          old = '''  function commitHistory(before) {
            const after = clone(annotations);
            if (JSON.stringify(before) === JSON.stringify(after)) return;
            const tx = { id: history.nextId++, mode: historyKey(), before, after, applied: true };
            history.globalUndo.push(tx);
            history.byMode[tx.mode].push(tx);
            if (history.globalUndo.length > MAX_UNDO) history.globalUndo.shift();
            if (history.byMode[tx.mode].length > MAX_UNDO) history.byMode[tx.mode].shift();
            history.globalRedo.length = 0;
            history.redoByMode[tx.mode].length = 0;
            modeCache[tx.mode] = clone(after);
            updateUndoRedoButtons();
          }'''
          new = '''  function commitHistory(before) {
            if (modeLoading) return false;
            const after = clone(annotations);
            if (JSON.stringify(before) === JSON.stringify(after)) return false;
            const tx = { id: history.nextId++, mode: historyKey(), before, after, applied: true };
            history.globalUndo.push(tx);
            history.byMode[tx.mode].push(tx);
            if (history.globalUndo.length > MAX_UNDO) history.globalUndo.shift();
            if (history.byMode[tx.mode].length > MAX_UNDO) history.byMode[tx.mode].shift();
            history.globalRedo.length = 0;
            history.redoByMode[tx.mode].length = 0;
            modeCache[tx.mode] = clone(after);
            updateUndoRedoButtons();
            return true;
          }'''
          if old not in s: raise SystemExit('commitHistory block not found')
          s = s.replace(old, new, 1)

          s = s.replace("  function undo() {\n", "  function undo() {\n    if (modeLoading) return;\n", 1)
          s = s.replace("  function redo() {\n", "  function redo() {\n    if (modeLoading) return;\n", 1)
          s = s.replace("  function saveAnnotations(mode = annotationMode, data = annotations) {\n", "  function saveAnnotations(mode = annotationMode, data = annotations) {\n    if (modeLoading) return;\n", 1)
          s = s.replace("  function nudgeSelected(dx, dy) {\n", "  function nudgeSelected(dx, dy) {\n    if (modeLoading) return false;\n", 1)
          s = s.replace("    commitHistory(before);\n    saveAnnotations();\n    paint();\n    return true;\n  }\n\n  function deleteSelected()", "    if (!commitHistory(before)) { paint(); return false; }\n    saveAnnotations();\n    paint();\n    return true;\n  }\n\n  function deleteSelected()", 1)
          s = s.replace("  function deleteSelected() {\n", "  function deleteSelected() {\n    if (modeLoading) return;\n", 1)

          old = '''  function requestAnnotationMode(next) {
            if (next === annotationMode) return;
            setToolMode('none');
            clearSelection();
            hoveredIdx = -1;
            annotationMode = next;
            pointMode = next === 'point';
            boxMode = next === 'rect';
            updateModeUi();
            vscode.postMessage({ type: 'switchAnnotationMode', mode: next });
          }'''
          new = '''  function requestAnnotationMode(next) {
            if (next === annotationMode && !modeLoading) return;
            setToolMode('none');
            clearSelection();
            hoveredIdx = -1;
            pendingMode = next;
            modeLoading = true;
            annotationMode = next;
            pointMode = next === 'point';
            boxMode = next === 'rect';
            annotations = [];
            nextId = 1;
            listSignature = '';
            updateModeUi();
            paint();
            vscode.postMessage({ type: 'switchAnnotationMode', mode: next });
          }'''
          if old not in s: raise SystemExit('requestAnnotationMode not found')
          s = s.replace(old, new, 1)

          old = '''  function formatNormalizedBox(box) {
            return [box.x, box.y, box.w, box.h].map(v => v.toFixed(COORD_DECIMALS)).join(copyCoordsSpace ? ', ' : ',');
          }'''
          new = '''  function formatNormalizedBox(box) {
            const values = coordPreferXywh
              ? [box.x, box.y, box.w, box.h]
              : [box.x, box.y, box.x + box.w, box.y + box.h];
            return values.map(v => v.toFixed(COORD_DECIMALS)).join(copyCoordsSpace ? ', ' : ',');
          }'''
          if old not in s: raise SystemExit('formatNormalizedBox not found')
          s = s.replace(old, new, 1)

          start = s.index('  function parseClipboardPayload(text) {')
          end = s.index('\n  function pasteStatus(text) {', start)
          new_parser = '''  function parseClipboardPayload(text) {
            const raw = String(text || '').trim();
            if (!raw) return null;
            let name;
            let box;
            let parsed;
            try { parsed = JSON.parse(raw); } catch { parsed = undefined; }
            if (parsed && !Array.isArray(parsed) && typeof parsed === 'object' && Array.isArray(parsed.bbox)) {
              box = asXywh(parsed.bbox);
              if (typeof parsed.name === 'string' && parsed.name.trim()) name = parsed.name.trim();
            } else {
              let values;
              if (Array.isArray(parsed)) values = parsed;
              else if (parsed === undefined) {
                const plain = raw.replace(/[\\[\\](){}]/g, ' ').split(/[\\s,;]+/).filter(Boolean).map(Number);
                if (plain.length === 4 && plain.every(Number.isFinite)) values = plain;
              }
              box = interpretBareCoordinates(values);
            }
            return box ? { name, box } : null;
          }
'''
          s = s[:start] + new_parser + s[end:]

          s = s.replace("  function addPastedAnnotation(name, pixel) {\n", "  function addPastedAnnotation(name, pixel) {\n    if (modeLoading) return;\n", 1)
          old = '''    if (!zeroSize && annotationMode === 'point') {
              pasteStatus('Point mode only accepts zero-size coordinates.');
              return;
            }
            const pixel = {
              x: Math.round(payload.box.x * img.width),
              y: Math.round(payload.box.y * img.height),
              w: zeroSize ? 0 : Math.max(1, Math.round(payload.box.w * img.width)),
              h: zeroSize ? 0 : Math.max(1, Math.round(payload.box.h * img.height)),
            };'''
          new = '''    let box = payload.box;
            if (!zeroSize && annotationMode === 'point') {
              box = { x: box.x + box.w / 2, y: box.y + box.h / 2, w: 0, h: 0 };
            }
            const finalZeroSize = box.w === 0 && box.h === 0;
            const pixel = {
              x: Math.round(box.x * img.width),
              y: Math.round(box.y * img.height),
              w: finalZeroSize ? 0 : Math.max(1, Math.round(box.w * img.width)),
              h: finalZeroSize ? 0 : Math.max(1, Math.round(box.h * img.height)),
            };'''
          if old not in s: raise SystemExit('point paste block not found')
          s = s.replace(old, new, 1)
          s = s.replace("    if (!img || toolMode !== 'none') return;\n    const payload = parseClipboardPayload(text);", "    if (!img || toolMode !== 'none' || modeLoading) return;\n    const payload = parseClipboardPayload(text);", 1)
          s = s.replace("Clipboard is not a normalized x, y, w, h annotation.", "Clipboard is not a valid normalized coordinate tuple.", 1)

          # Save only if an actual drag/resize edit occurred.
          s = s.replace("      commitHistory(clone(before)); saveAnnotations(); paint();", "      if (commitHistory(clone(before))) saveAnnotations(); paint();", 1)
          s = s.replace("      commitHistory(clone(before)); saveAnnotations(); paint();", "      if (commitHistory(clone(before))) saveAnnotations(); paint();", 1)

          # Checkbox is owned by the app itself; changing it refreshes readout/canvas label.
          anchor = "  document.getElementById('sharedHistoryChk').onchange = (e) => {\n"
          idx = s.index(anchor)
          close = s.index("  };", idx) + len("  };")
          insert = '''
          const coordPreferXywhChk = document.getElementById('coordPreferXywhChk');
          coordPreferXywhChk.checked = coordPreferXywh;
          coordPreferXywhChk.onchange = (e) => {
            coordPreferXywh = e.target.checked;
            if (typeof vscode.setState === 'function') vscode.setState({ ...((typeof vscode.getState === 'function' && vscode.getState()) || {}), coordPreferXywh });
            if (coordBox) copyCoordBox(true);
            paint();
          };'''
          s = s[:close] + insert + s[close:]

          # Block direct destructive toolbar actions while a mode load is pending.
          s = s.replace("    if (matchKeybinding(e, keybindings.copy) && hasSelection()", "    if (!modeLoading && matchKeybinding(e, keybindings.copy) && hasSelection()", 1)
          s = s.replace("    if (matchKeybinding(e, keybindings.paste) && toolMode === 'none')", "    if (!modeLoading && matchKeybinding(e, keybindings.paste) && toolMode === 'none')", 1)
          s = s.replace("  function finishRect(px, py) {\n", "  function finishRect(px, py) {\n    if (modeLoading) return;\n", 1)
          s = s.replace("  function finishPoint(px, py) {\n", "  function finishPoint(px, py) {\n    if (modeLoading) return;\n", 1)

          # Ignore stale responses from a rapid mode switch; only the requested mode may unlock editing.
          marker = "    const incomingMode = msg.annotationMode || annotationMode;\n"
          repl = marker + "    if (pendingMode && incomingMode !== pendingMode) return;\n    if (pendingMode === incomingMode) { pendingMode = null; modeLoading = false; }\n"
          if marker not in s: raise SystemExit('load incomingMode marker not found')
          s = s.replace(marker, repl, 1)

          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # 2) index.html: remove the temporary coordinate bridge; app.js is source of truth.
          # ------------------------------------------------------------------
          p = Path('media/annotationPanel/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  <div id="annotationPanelI18n" hidden>__I18N_JSON__</div>'
          i = s.index(marker)
          s = s[:i] + marker + '\n  <script src="__APP_SCRIPT_URI__"></script>\n</body>\n</html>\n'
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) resource preview thumbnails carry mode; stale batches are ignored.
          # ------------------------------------------------------------------
          p = Path('src/templatePanel.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import { cropTemplateThumbFileAsync, openAnnotatedImage, THUMB_HEIGHT } from './pngCrop';",
                        "import { annotatedImageFile, cropTemplateThumbFileAsync, openAnnotatedImage, THUMB_HEIGHT } from './pngCrop';")
          s = s.replace("await this.webview.postMessage({ type: 'thumbs', items });", "await this.webview.postMessage({ type: 'thumbs', mode: this.mode, items });")
          s = s.replace("await this.openOriginalWithMarker(msg.imagePath, msg.name, msg.bbox);", "await this.openOriginalWithMarker(msg.imagePath, msg.name, msg.bbox, this.mode);")
          s = s.replace("private async openOriginalWithMarker(imagePath: string, name: string, bboxJson: string): Promise<void> {",
                        "private async openOriginalWithMarker(imagePath: string, name: string, bboxJson: string, mode: ResourcePreviewMode): Promise<void> {")
          s = s.replace("async () => openAnnotatedImage(imagePath, name, bbox!, this.thumbDir, this.features.root),",
                        "async () => mode === 'template'\n          ? openAnnotatedImage(imagePath, name, bbox!, this.thumbDir, this.features.root)\n          : annotatedImageFile(imagePath, bbox!, this.thumbDir),")
          p.write_text(s, encoding='utf-8')

          p = Path('media/templatePanel/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("      case 'thumbs': {\n        for (const it of (msg.items || []))", "      case 'thumbs': {\n        if (msg.mode && msg.mode !== currentMode) break;\n        for (const it of (msg.items || []))")
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # 4) remove fake currentBoxes compatibility symbol.
          # ------------------------------------------------------------------
          p = Path('src/templateAssetPanel.ts')
          s = p.read_text(encoding='utf-8')
          old = "(this.boxes ? AnnotationPanel.currentBoxes : AnnotationPanel.current)?.controller.reloadIfShowing([sourcePath, targetPath]);"
          if old not in s: raise SystemExit('currentBoxes call not found')
          s = s.replace(old, "AnnotationPanel.current?.controller.reloadIfShowing([sourcePath, targetPath]);", 1)
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------------
          # 5) collision-safe generated Python class names.
          # ------------------------------------------------------------------
          p = Path('src/positionResourcePure.ts')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\nfunction pascalCase\(value: string\): string \{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          old = '''function classNameForPath(parts: string[]): string {
            if (parts.length === 1 && parts[0] === 'screen') return 'ScreenPosition';
            return parts.map(pascalCase).join('') + 'Position';
          }'''
          new = '''function classNameForPath(parts: string[]): string {
            if (parts.length === 1 && parts[0] === 'screen') return 'ScreenPosition';
            // Preserve exact segment boundaries and case so distinct valid paths cannot collapse
            // to the same Python class name (e.g. a_b.c vs a.b_c, foo vs Foo).
            return 'Position_' + parts.map(part => `${part.length}_${part}`).join('__');
          }'''
          if old not in s: raise SystemExit('classNameForPath not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and obsolete declaration
        shell: bash
        run: |
          git rm .github/workflows/codex-review-fixes.yml src/annotationPanelCompat.d.ts
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add media/annotationPanel/app.js media/annotationPanel/index.html media/templatePanel/app.js src/templatePanel.ts src/templateAssetPanel.ts src/positionResourcePure.ts
          git commit -m "fix: address unified annotation review findings"
          git push origin HEAD:codex/unified-annotation-resources
