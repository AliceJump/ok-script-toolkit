name: codex-review-fixes

on:
  push:
    branches:
      - codex/unified-annotation-resources

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-annotation-resources
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python scripts/codex_review_patch_fix.py
          python scripts/codex_review_patch.py
      - name: Commit fixes and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/codex-review-fixes.yml scripts/codex_review_patch.py scripts/codex_review_patch_fix.py src/annotationPanelCompat.d.ts
          git add media/annotationPanel/app.js media/annotationPanel/index.html media/templatePanel/app.js src/templatePanel.ts src/templateAssetPanel.ts src/positionResourcePure.ts
          git commit -m "fix: address unified annotation review findings"
          git push origin HEAD:codex/unified-annotation-resources
